<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Bishwajeet Kumar</title>
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css" rel="stylesheet" />
  <link rel="icon" href="./assets/img/h1.png" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap");

    *, ::before, ::after { box-sizing: border-box; }

    :root {
      --bg: #040811;
      --bg-2: #080f1e;
      --bg-card: rgba(255,255,255,0.03);
      --accent: #00d4ff;
      --accent-2: #7b5ea7;
      --text: #e8eaf0;
      --text-muted: #7a8099;
      --border: rgba(255,255,255,0.07);
      --border-accent: rgba(0,212,255,0.3);
      --font-display: "Syne", sans-serif;
      --font-body: "DM Sans", sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2rem;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--accent); }

    .contact-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .contact-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
    }

    .contact-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0,212,255,0.08);
      border: 1px solid var(--border-accent);
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      margin-bottom: 1.5rem;
    }

    .contact-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }

    .contact-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .form-input::placeholder,
    .form-textarea::placeholder { color: var(--text-muted); }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--border-accent);
      background: rgba(0,212,255,0.03);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.07);
    }

    .form-textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-submit {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,212,255,0.05));
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .form-submit::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), #0099bb);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .form-submit:hover { color: var(--bg); }
    .form-submit:hover::before { opacity: 1; }
    .form-submit span { position: relative; z-index: 1; }
    .form-submit i { position: relative; z-index: 1; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <a href="index.html" class="back-link">
      <i class="bx bx-arrow-back"></i> Back to Portfolio
    </a>

    <div class="contact-card">
      <span class="contact-eyebrow"><i class="bx bx-envelope"></i> Contact</span>
      <h1 class="contact-title">Get in Touch</h1>
      <p class="contact-desc">Fill out the form below and I'll get back to you as soon as possible. Whether it's a project, collaboration, or just a hello.</p>

      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="e6cafa12-c936-4bfe-a4fa-f53c2438d0e3" />
        <input type="hidden" name="subject" value="New Contact Form Submission" />
        <input type="hidden" name="from_name" value="Portfolio – Bishwajeet Kumar" />

        <div class="form-group">
          <label class="form-label" for="name">Your Name</label>
          <input class="form-input" id="name" name="name" type="text" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone (optional)</label>
          <input class="form-input" id="phone" name="phone" type="text" placeholder="+91 XXXXX XXXXX" />
        </div>
        <div class="form-group">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-textarea" id="message" name="message" placeholder="Tell me about your project or inquiry..." required></textarea>
        </div>

        <button class="form-submit" type="submit">
          <span>Send Message</span>
          <i class="bx bx-send"></i>
        </button>
      </form>
    </div>
  </div>
</body>
</html>
